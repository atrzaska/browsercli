name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The end-to-end suite launches the runner's preinstalled Google Chrome headless.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
